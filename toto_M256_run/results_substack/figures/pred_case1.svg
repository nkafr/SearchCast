<rect x="600" y="170" width="40" height="28" rx="2" fill="var(--m15)" fill-opacity="0.9" stroke="var(--border)" stroke-width="0.5"/>
<text class="tss" x="60" y="210" text-anchor="middle">steps</text>
<text class="tss" x="60" y="222" text-anchor="middle">1&#8211;48</text>
<text class="tss" x="100" y="210" text-anchor="middle">steps</text>
<text class="tss" x="100" y="222" text-anchor="middle">49&#8211;96</text>
<text class="tss" x="616" y="210" text-anchor="middle">steps</text>
