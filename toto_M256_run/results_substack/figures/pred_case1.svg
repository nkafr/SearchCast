<text class="ts" x="40" y="424">Model 15 needs step 14,401, past the test end, so this origin drops out of the H=720 tensor.</text>
<text class="ts" x="40" y="440">Shorter horizons still keep it, so the window count N differs per cutoff:</text>
<text class="ts" x="40" y="466">H=96 &#8594; (2785, 7, 96)     H=192 &#8594; (2689, 7, 192)     H=336 &#8594; (2545, 7, 336)</text>
<text class="ts" x="93" y="486" text-anchor="end">H=720 &#8594; (</text>
<rect x="93" y="475" width="30" height="16" rx="3" fill="none" stroke="var(--hl)" stroke-width="1.2" stroke-dasharray="4 3"/>
<text class="ts" x="108" y="486" text-anchor="middle" fill="var(--hl)" font-weight="500">2161</text>
<text class="ts" x="125" y="486">, 7, 720)</text>
<text class="ts" x="40" y="510">Both dotted boxes mark the same 2,161: the last full window is the H=720 window count.</text>
<text class="ts" x="40" y="526">One channel shown. All 7 channels share the same 15 models (pooling).</text>
