<text class="t"  x="120" y="286" text-anchor="middle">&#8942;</text>
<text class="ts" x="150" y="286">2,158 more windows, each slid one more step</text>
<rect x="34" y="298" width="612" height="54" rx="6" fill="none" stroke="var(--hl)" stroke-width="1.2" stroke-dasharray="4 3"/>
